name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained single file, win-x64)
        run: >
          dotnet publish desktop/Clite.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path publish/Clite.exe -DestinationPath "Clite-${{ github.ref_name }}-win-x64.zip"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Clite-${{ github.ref_name }}-win-x64.zip
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: true
