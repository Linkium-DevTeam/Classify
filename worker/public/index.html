<!DOCTYPE html>
<!-- 自动生成，请改 lite/web（tools/build-web.ps1） -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classify Lite — 极简远程喊话</title>
<meta name="theme-color" content="#F4F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/lite.css">
</head>
<body data-api-base="/api" data-app-url="https://classify.linkium.top/app">
<div class="card">
  <h1>Classify Lite</h1>
  <p class="sub">极简远程喊话 · 输入设备口令即可发送</p>
  <div class="field">
    <label class="label" for="code">设备口令（教室电脑上查看）</label>
    <input class="code" id="code" maxlength="8" placeholder="00000000" inputmode="numeric" autocomplete="off"
      aria-describedby="status">
  </div>
  <div class="field">
    <label class="label" for="text">喊话内容</label>
    <textarea id="text" placeholder="输入要展示在教室大屏的文字"></textarea>
  </div>
  <button type="button" class="btn" id="send">📢 发送到大屏</button>
  <div class="msg ok" id="msg-ok" role="status" aria-live="polite"></div>
  <div class="msg err" id="msg-err" role="alert" aria-live="assertive"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="donate" id="donate">
    <h2>💜 支持开发者</h2>
    <p>Classify Lite 免费无广告，但云端服务器有每月成本。觉得好用，请作者喝杯奶茶 ♥</p>
    <a class="donate-afdian" href="https://afdian.com/a/linkium" target="_blank" rel="noopener">⚡ 爱发电 · 便捷支持（可月供）</a>
    <div class="donate-grid">
      <figure>
        <img src="/icons/donate-wechat.png" alt="微信赞赏">
        <figcaption>微信 · 长安不洛雪</figcaption>
      </figure>
      <figure>
        <img src="/icons/donate-alipay.jpg" alt="支付宝收款">
        <figcaption>支付宝 · Linkium-suki</figcaption>
      </figure>
    </div>
  </div>
  <footer>Classify Lite · <a id="full-app-link" href="https://classify.linkium.top/app">完整版 Classify</a> · support@linkium.top</footer>
</div>
<script defer src="/lite.js"></script>
</body>
</html>
